name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Engine & CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: cargo fmt --all --check
      - run: cargo clippy -p hibernate-core -p hibernate-cli --all-targets -- -D warnings
      - run: cargo test -p hibernate-core -p hibernate-cli
      - name: Smoke-test the CLI
        shell: bash
        run: |
          mkdir -p /tmp/fx/demo/src
          echo '{"name":"demo"}' > /tmp/fx/demo/package.json
          mkdir -p /tmp/fx/demo/node_modules/x && head -c 100000 /dev/zero > /tmp/fx/demo/node_modules/x/blob
          cargo run -q -p hibernate-cli -- scan /tmp/fx | tee out.txt
          grep -q "node_modules/" out.txt

  supply-chain:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo audit (RustSec advisories)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: cargo deny (licenses, yanked crates, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources bans
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (all, informational)
        run: npm audit --audit-level=critical || true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  e2e:
    name: UI walkthrough (mock backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start dev server
        run: npx vite --port 1420 --strictPort &
      - run: npx wait-on http://localhost:1420
      - run: npm run e2e

  desktop:
    name: Desktop app (${{ matrix.os }})
    needs: [engine, frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev libxdo-dev
      - run: npm ci
      - run: cargo build -p project-hibernate
      - name: Test the Tauri layer
        run: cargo test -p project-hibernate
      - name: Desktop smoke test (real binary on Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb xdotool imagemagick
          npm run smoke:desktop
      - name: Bundle
        run: npx tauri build --ci
      - uses: actions/upload-artifact@v4
        with:
          name: project-hibernate-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: ignore
