name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: no job needs to write to the repository.
permissions:
  contents: read

env:
  # Lints are pinned so a new Rust release cannot turn `main` red on its own.
  # The `lint-drift` job below reports new lints on the rolling stable channel
  # without failing the build; bump this version when adopting its findings.
  RUST_LINT_VERSION: "1.98.0"

jobs:
  lint:
    name: Rust lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_LINT_VERSION }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev libxdo-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  lint-drift:
    name: New lints on latest stable (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Report lints that a newer toolchain would raise
        run: |
          rustc --version
          cargo clippy -p hibernate-core -p hibernate-cli --all-targets -- -D warnings

  engine:
    name: Engine & CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: cargo test -p hibernate-core -p hibernate-cli
      - name: Smoke-test the CLI
        shell: bash
        run: |
          mkdir -p /tmp/fx/demo/src
          echo '{"name":"demo"}' > /tmp/fx/demo/package.json
          mkdir -p /tmp/fx/demo/node_modules/x && head -c 100000 /dev/zero > /tmp/fx/demo/node_modules/x/blob
          cargo run -q -p hibernate-cli -- scan /tmp/fx | tee out.txt
          grep -q "node_modules/" out.txt

  supply-chain:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Two layers: cargo-audit fails on any known *vulnerability*; cargo-deny
      # enforces the wider policy (licenses, sources, yanked crates, and
      # unmaintained crates with the documented exceptions in deny.toml).
      - name: cargo audit (RustSec vulnerabilities)
        run: cargo audit
      - name: cargo deny (advisories, licenses, sources, bans)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources bans
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (all, informational)
        run: npm audit --audit-level=critical || true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  e2e:
    name: UI walkthrough (mock backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start dev server
        run: npx vite --port 1420 --strictPort &
      - run: npx wait-on http://localhost:1420
      - name: Walkthrough
        env:
          SHOTS: e2e-screenshots
        run: |
          mkdir -p e2e-screenshots
          npm run e2e
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-screenshots
          if-no-files-found: ignore

  desktop:
    name: Desktop app (${{ matrix.os }})
    needs: [lint, engine, frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev libxdo-dev
      - run: npm ci
      - run: cargo build -p project-hibernate
      - name: Test the Tauri layer
        run: cargo test -p project-hibernate
      - name: Desktop smoke test (real binary on Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb xdotool imagemagick
          npm run smoke:desktop
      - name: Bundle
        run: npx tauri build --ci
      - uses: actions/upload-artifact@v4
        with:
          name: project-hibernate-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: ignore
