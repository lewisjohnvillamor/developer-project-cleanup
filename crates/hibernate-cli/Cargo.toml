[package]
name = "hibernate-cli"
description = "Command-line scanner and hibernate tool for developer projects"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hibernate"
path = "src/main.rs"

[dependencies]
hibernate-core = { path = "../hibernate-core" }
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
chrono.workspace = true
ctrlc = "3"
